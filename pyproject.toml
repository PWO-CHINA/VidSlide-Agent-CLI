[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "vidslide-agent-cli"
version = "0.1.0"
description = "AI-native CLI tool for extracting PowerPoint slides from screen recordings"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PWO-CHINA", email = "dev@pwo-china.com"}
]
maintainers = [
    {name = "PWO-CHINA", email = "dev@pwo-china.com"}
]
keywords = ["video", "slides", "ppt", "extraction", "ai-agent", "cli", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: Office/Business",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/PWO-CHINA/VidSlide-Agent-CLI"
Documentation = "https://github.com/PWO-CHINA/VidSlide-Agent-CLI#readme"
Repository = "https://github.com/PWO-CHINA/VidSlide-Agent-CLI"
Issues = "https://github.com/PWO-CHINA/VidSlide-Agent-CLI/issues"
Changelog = "https://github.com/PWO-CHINA/VidSlide-Agent-CLI/blob/master/CHANGELOG.md"

[project.scripts]
vidslide = "vidslide.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vidslide*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
vidslide = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''
